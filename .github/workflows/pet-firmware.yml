# Unofficial COLDCARD Tamagotchi fork -- CI
#
# tests:      the pet model + UX under CPython with a fake clock (no toolchain)
# simulator:  the pet running on REAL MicroPython in Coinkite's headless desktop
#             simulator, driven over its socket; real OLED frames are saved
# firmware:   Mk4 .dfu built in Coinkite's own build container, signed with the
#             public dev key zero
# release:    on tags pet-v*, a GitHub Release with the .dfu, its sha256, and the
#             simulator screenshots
name: tamagotchi

on:
  push:
    branches: ['**']
    tags: ['pet-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: pet tests (CPython)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest pillow
      - name: unit + UX tests against a fake clock
        run: cd pet && python -m pytest -q
      - name: render every screen through the real display code
        run: python pet/tools/render.py pet/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: pet-screens
          path: pet/screenshots/*.png

  simulator:
    name: pet on real MicroPython (headless simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: submodules
        run: |
          git submodule update --init external/micropython external/libngu external/mpy-qr external/ckcc-protocol
          git -C external/micropython submodule update --init lib/axtls lib/berkeley-db-1.xx lib/libffi
          git -C external/libngu/libs submodule update --init bech32 cifra secp256k1

      - name: apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential libffi-dev pkg-config autoconf automake libtool libsdl2-2.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -q -r unix/requirements.txt
          python -m pip install -q ./external/ckcc-protocol

      - name: build the simulator (unix port, coldcard-mpy variant)
        shell: bash
        run: |
          set -o pipefail
          (
            set -ex
            cd unix
            ln -sf ../external/micropython/ports/unix l-port
            ln -sf ../external/micropython l-mpy
            ln -sf ../external/micropython/ports/unix/coldcard-mpy coldcard-mpy
            # this MicroPython predates GCC 12+'s new warnings and builds with -Werror;
            # the warnings are in upstream core (py/stackctrl.c), not our code
            export CFLAGS_EXTRA=-Wno-error
            make -C ../external/micropython/mpy-cross -j4
            make ngu-setup
            make tools
            make
            ls -la coldcard-mpy l-port/coldcard-mpy
          ) 2>&1 | tee build.log

      - name: run it, headless, and drive the pet over the socket
        shell: bash
        run: |
          set -o pipefail
          rm -rf unix/work/MicroSD/pets
          (cd unix && ./simulator.py --headless --pet > ../sim.log 2>&1 &)
          python pet/tools/sim_drive.py pet/screenshots/sim 2>&1 | tee drive.log
          echo "--- simulator output"
          cat sim.log
          ! grep -n -e Traceback -e Yikes -e Panic sim.log

      - name: log tails as annotations (readable without signing in)
        if: always()
        shell: bash
        run: |
          # annotations show on the public run page; logs and summaries need a login
          for f in build.log drive.log sim.log; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys
          f = sys.argv[1]
          lines = open(f, errors='replace').read().splitlines()[-90:]
          for i in range(0, len(lines), 30):
              chunk = '\n'.join(lines[i:i+30])
              chunk = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::warning title=%s lines %d-%d::%s' % (f, i, i+30, chunk[:3800]))
          PY
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-screens
          path: |
            pet/screenshots/sim/*.png
            sim.log
            build.log
            drive.log

  firmware:
    name: Mk4 firmware (.dfu, dev key 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: submodules (not the 1 GB STM32Cube HAL, bootloader is never rebuilt)
        run: |
          git submodule update --init external/micropython external/libngu external/mpy-qr external/ckcc-protocol
          git -C external/micropython submodule update --init lib/stm32lib
          git -C external/libngu/libs submodule update --init bech32 cifra secp256k1

      - name: build container (Coinkite's, plus a host gcc for mpy-cross)
        run: |
          sed 's/musl-dev make/musl-dev gcc make/' stm32/dockerfile.build \
            | docker build -t coldcard-build -

      - name: build + sign with key zero
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/work/src" -w /work/src \
            -e HOME=/tmp -u "$(id -u):$(id -g)" coldcard-build \
            sh stm32/pet-build.sh 2>&1 | tee fw-build.log

      - name: build log tail as annotations (readable without signing in)
        if: failure()
        shell: bash
        run: |
          python3 - fw-build.log <<'PY'
          import sys
          f = sys.argv[1]
          lines = open(f, errors='replace').read().splitlines()[-90:]
          for i in range(0, len(lines), 30):
              chunk = '\n'.join(lines[i:i+30])
              chunk = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::warning title=%s lines %d-%d::%s' % (f, i, i+30, chunk[:3800]))
          PY

      - name: header sanity (dev key 0, no high-water flag)
        run: |
          python3 - <<'PY'
          import sys, struct
          sys.path.insert(0, 'stm32')
          from sigheader import FW_HEADER_OFFSET, FW_HEADER_SIZE, FWH_PY_FORMAT, FWH_PY_VALUES, FW_HEADER_MAGIC
          raw = open('stm32/firmware-signed.bin', 'rb').read()[FW_HEADER_OFFSET:FW_HEADER_OFFSET + FW_HEADER_SIZE]
          h = dict(zip(FWH_PY_VALUES.split(), struct.unpack_from(FWH_PY_FORMAT, raw)))
          print('version %r pubkey_num %d install_flags %d timestamp %s firmware_length %d'
                % (h['version_string'].rstrip(bytes(1)), h['pubkey_num'], h['install_flags'],
                   h['timestamp'].hex(), h['firmware_length']))
          assert h['magic_value'] == FW_HEADER_MAGIC
          assert h['pubkey_num'] == 0, 'must be signed with dev key zero'
          assert h['install_flags'] == 0, 'must not carry the high-water flag'
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-mk4-dfu
          path: |
            stm32/*-mk-tamagotchi.dfu
            stm32/firmware-signed.dfu
            stm32/firmware-signed.bin
            stm32/firmware.elf
            stm32/built-sha256.txt
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/pet-v')
    needs: [tests, simulator, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tamagotchi-mk4-dfu
          path: dfu
      - uses: actions/download-artifact@v4
        with:
          name: sim-screens
          path: sim
      - run: |
          (cd sim && zip -q ../simulator-screenshots.zip *.png sim.log)
          ls -la dfu sim
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dfu/*-mk-tamagotchi.dfu
            dfu/built-sha256.txt
            simulator-screenshots.zip
          body: |
            Unofficial COLDCARD Mk4 firmware that turns the device into a virtual pet.
            Not made, endorsed or supported by Coinkite. Signed with the PUBLIC dev key
            zero: the bootloader shows a warning and a delay on every boot. That is
            expected. See README.md for flashing and for the way back to stock firmware.

            The simulator screenshots were taken from this exact code running on
            MicroPython in Coinkite's desktop simulator, headless, in CI.
